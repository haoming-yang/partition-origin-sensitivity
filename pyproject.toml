[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partition-origin-sensitivity"
version = "1.0.0"
description = "Controlled audit of partition-origin effects in patch-based time-series forecasting"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Haoming Yang"}]
dependencies = [
  "numpy==1.26.4",
  "pandas==1.5.3",
  "PyYAML==6.0.3",
  "matplotlib==3.7.1",
  "scikit-learn==1.6.1",
  "einops==0.8.1",
  "reformer-pytorch==1.4.4",
  "timm==0.3.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["src*"]
